name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git short-SHA tag to roll back to"
        required: true
        type: string

env:
  IMAGE_NAME: manishgandla/myapp

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Rollback to selected version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/myapp

            echo "IMAGE_TAG=${{ inputs.image_tag }}" > .env.deploy

            docker pull ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}

            docker compose \
              --env-file .env.deploy \
              -f docker-compose.prod.yml \
              up -d

            docker image prune -f
