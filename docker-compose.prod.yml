services:
  app:
    image: YOUR_DOCKERHUB_USERNAME/myapp:${IMAGE_TAG:-latest}
    container_name: myapp
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
